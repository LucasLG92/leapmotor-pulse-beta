name: verify-ios

on:
  workflow_dispatch:
    inputs:
      device_ipa:
        description: Build a generic unsigned iPhone IPA with WidgetKit (not installable without signing)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-ios:
    name: App and WidgetKit builds and app startup
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      PULSE_CHECK_PYTHON: python
      PULSE_CHECK_IOS_DEVICE_IPA: ${{ inputs.device_ipa && '1' || '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24.19.0"

      - name: Build iOS app and widget for simulator
        run: bash scripts/check-ios.sh

      - name: Retain generic app startup evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-simulator-startup
          path: |
            apps/mobile/ios/App/output/ci-smoke/startup-initial.png
            apps/mobile/ios/App/output/ci-smoke/startup.png
            apps/mobile/ios/App/output/ci-smoke/startup-diagnostic.png
            apps/mobile/ios/App/output/ci-smoke/receipt.json
          retention-days: 7
          if-no-files-found: warn

      - name: Retain Swift resolution and advisory evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-spm-security
          path: |
            apps/mobile/ios/App/output/ci-spm/Package.resolved
            apps/mobile/ios/App/output/ci-spm/inventory.json
            apps/mobile/ios/App/output/ci-spm/osv-query.json
            apps/mobile/ios/App/output/ci-spm/receipt.json
          retention-days: 7
          if-no-files-found: error

      - name: Retain generic unsigned iPhone artifact
        if: ${{ always() && inputs.device_ipa }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-device-unsigned
          path: |
            apps/mobile/ios/App/output/ci-device/unsigned.ipa
            apps/mobile/ios/App/output/ci-device/receipt.json
          retention-days: 7
          if-no-files-found: error
