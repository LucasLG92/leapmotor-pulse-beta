name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests and production image checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PULSE_CHECK_PYTHON: python
      PULSE_CHECK_PNPM: pnpm
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.14"

      - name: Set up Node.js
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: "24.19.0"

      - name: Install hashed Python development dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --require-hashes --no-input -r requirements-build-lock.txt
          python -m pip install --disable-pip-version-check --no-cache-dir --only-binary=:all: --no-binary=http-ece --no-build-isolation --require-hashes --no-input -r requirements-dev-lock.txt
          python -m pip check

      - name: Activate pinned pnpm through Corepack
        run: |
          corepack enable pnpm
          corepack prepare pnpm@11.25.0 --activate
          test "$(pnpm --version)" = "11.25.0"

      - name: Run contracts, tests, and container checks
        run: bash scripts/check-container.sh

      - name: Verify community installer lifecycle
        shell: bash
        run: |
          set -Eeuo pipefail
          project=leapmotor-pulse-beta-public
          volume="${project}_pulse-data"
          project_filter="label=com.docker.compose.project=${project}"
          service_filter='label=com.docker.compose.service=pulse'

          bash install.sh --check
          cleanup() {
            status=$?
            trap - EXIT
            bash install.sh --stop >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          bash install.sh --install
          curl --fail --silent --show-error --max-time 10 --output /dev/null http://127.0.0.1:8780/readyz
          curl --fail --silent --show-error --max-time 10 --output /dev/null http://127.0.0.1:8780/
          bash install.sh --stop

          mapfile -t containers < <(docker ps --all --filter "$project_filter" --filter "$service_filter" --format '{{.ID}}')
          if [[ ${#containers[@]} -eq 0 ]]; then
            printf '%s\n' 'No se encontró el contenedor de Pulse beta tras detenerlo.' >&2
            exit 1
          fi
          running="$(docker ps --filter "$project_filter" --filter "$service_filter" --format '{{.ID}}')"
          if [[ -n "$running" ]]; then
            printf '%s\n' 'El servicio Pulse beta sigue ejecutándose después de --stop.' >&2
            exit 1
          fi
          for container in "${containers[@]}"; do
            state="$(docker inspect --format '{{.State.Status}}' "$container")"
            if [[ "$state" != exited ]]; then
              printf 'El contenedor Pulse beta %s tiene estado inesperado: %s\n' "$container" "$state" >&2
              exit 1
            fi
          done

          actual_volume="$(docker volume inspect --format '{{.Name}}' "$volume")"
          if [[ "$actual_volume" != "$volume" ]]; then
            printf '%s\n' 'No se encontró el volumen propio de Pulse beta tras --stop.' >&2
            exit 1
          fi
          trap - EXIT
