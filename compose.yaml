services:
  pulse:
    build: .
    image: leapmotor-pulse:0.1.0
    restart: unless-stopped
    # Host networking lets local-mode auth verify a loopback peer. The app
    # binds only to 127.0.0.1 and is not reachable from the LAN.
    network_mode: host
    environment:
      PULSE_NAME: ${PULSE_NAME:-Leapmotor Pulse}
      PULSE_BIND: ${PULSE_BIND:-127.0.0.1}
      PULSE_PORT: "8780"
      PULSE_AUTH_MODE: ${PULSE_AUTH_MODE:-local}
      PULSE_HOSTS: "${PULSE_HOSTS:-localhost,127.0.0.1,[::1]}"
      PULSE_PUBLIC_URL: ${PULSE_PUBLIC_URL:-}
      PULSE_OIDC_ISSUER: ${PULSE_OIDC_ISSUER:-}
      PULSE_OIDC_CLIENT_ID: ${PULSE_OIDC_CLIENT_ID:-}
      PULSE_OIDC_CLIENT_SECRET: ${PULSE_OIDC_CLIENT_SECRET:-}
      PULSE_ALLOWED_USERS: ${PULSE_ALLOWED_USERS:-}
      PULSE_NATIVE_ENABLED: ${PULSE_NATIVE_ENABLED:-false}
      PULSE_NATIVE_APP_ENABLED: ${PULSE_NATIVE_APP_ENABLED:-false}
      PULSE_NATIVE_CLIENT_ID: ${PULSE_NATIVE_CLIENT_ID:-}
      PULSE_NATIVE_AUDIENCE: ${PULSE_NATIVE_AUDIENCE:-}
      PULSE_NATIVE_INTROSPECTION_URL: ${PULSE_NATIVE_INTROSPECTION_URL:-}
      PULSE_NATIVE_USERINFO_URL: ${PULSE_NATIVE_USERINFO_URL:-}
      PULSE_NATIVE_INTROSPECTION_CLIENT_ID: ${PULSE_NATIVE_INTROSPECTION_CLIENT_ID:-}
      PULSE_NATIVE_INTROSPECTION_CLIENT_SECRET: ${PULSE_NATIVE_INTROSPECTION_CLIENT_SECRET:-}
      PULSE_REVOKE_WIDGET_GRANTS_ON_START: ${PULSE_REVOKE_WIDGET_GRANTS_ON_START:-false}
      PULSE_DB: /data/pulse.sqlite3
      PULSE_MQTT_ENABLED: ${PULSE_MQTT_ENABLED:-false}
      PULSE_MQTT_HOST: ${PULSE_MQTT_HOST:-}
      PULSE_MQTT_PORT: ${PULSE_MQTT_PORT:-8883}
      PULSE_MQTT_TLS: ${PULSE_MQTT_TLS:-true}
      PULSE_MQTT_CA_FILE: ${PULSE_MQTT_CA_FILE:-}
      PULSE_MQTT_USERNAME: ${PULSE_MQTT_USERNAME:-}
      PULSE_MQTT_PASSWORD: ${PULSE_MQTT_PASSWORD:-}
      PULSE_MQTT_INSTANCE: ${PULSE_MQTT_INSTANCE:-}
      PULSE_MQTT_DISCOVERY_PREFIX: ${PULSE_MQTT_DISCOVERY_PREFIX:-homeassistant}
      PULSE_MQTT_FIELDS: ${PULSE_MQTT_FIELDS:-}
      PULSE_MQTT_MAX_AGE_SECONDS: ${PULSE_MQTT_MAX_AGE_SECONDS:-900}
      PULSE_MQTT_POLL_SECONDS: ${PULSE_MQTT_POLL_SECONDS:-15}
      PULSE_PUSH_ENABLED: ${PULSE_PUSH_ENABLED:-false}
      PULSE_PUSH_VAPID_PRIVATE_KEY: ${PULSE_PUSH_VAPID_PRIVATE_KEY:-}
      PULSE_PUSH_STORAGE_KEY: ${PULSE_PUSH_STORAGE_KEY:-}
      PULSE_PUSH_CONTACT: ${PULSE_PUSH_CONTACT:-}
      PULSE_EVCC_ENABLED: ${PULSE_EVCC_ENABLED:-false}
      PULSE_EVCC_ORIGIN: ${PULSE_EVCC_ORIGIN:-}
      PULSE_EVCC_LOADPOINT: ${PULSE_EVCC_LOADPOINT:-}
      PULSE_EVCC_POLL_SECONDS: ${PULSE_EVCC_POLL_SECONDS:-60}
      PULSE_EVCC_HISTORY_SECONDS: ${PULSE_EVCC_HISTORY_SECONDS:-600}
      PULSE_EVCC_HISTORY_MONTHS: ${PULSE_EVCC_HISTORY_MONTHS:-3}
      PULSE_EVCC_ENERGY_HISTORY_ENABLED: ${PULSE_EVCC_ENERGY_HISTORY_ENABLED:-false}
      PULSE_NAVIGATION_ENABLED: ${PULSE_NAVIGATION_ENABLED:-false}
      PULSE_NAVIGATION_CONTACT: ${PULSE_NAVIGATION_CONTACT:-}
      PULSE_NAVIGATION_TILES_ORIGIN: ${PULSE_NAVIGATION_TILES_ORIGIN:-https://tile.openstreetmap.org}
      PULSE_NAVIGATION_PLACES_ORIGIN: ${PULSE_NAVIGATION_PLACES_ORIGIN:-https://nominatim.openstreetmap.org}
      PULSE_NAVIGATION_CHARGERS_ORIGIN: ${PULSE_NAVIGATION_CHARGERS_ORIGIN:-https://overpass-api.de}
      PULSE_ABRP_ENABLED: ${PULSE_ABRP_ENABLED:-false}
      PULSE_ABRP_API_KEY: ${PULSE_ABRP_API_KEY:-}
      PULSE_ABRP_USER_TOKEN: ${PULSE_ABRP_USER_TOKEN:-}
      PULSE_ABRP_POLL_SECONDS: ${PULSE_ABRP_POLL_SECONDS:-60}
      PULSE_ABRP_SEND_INTERVAL_SECONDS: ${PULSE_ABRP_SEND_INTERVAL_SECONDS:-300}
      PULSE_ABRP_MAX_AGE_SECONDS: ${PULSE_ABRP_MAX_AGE_SECONDS:-300}
    volumes:
      - pulse-data:/data
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev,size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -m, pulse.healthcheck]
      interval: 20s
      timeout: 3s
      start_period: 15s
      retries: 5
volumes:
  pulse-data:
